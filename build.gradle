plugins {
    id 'java' // Adds Java support
    id 'application' // Adds Java support and application execution capabilities
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral{
        name = "Maven Central"
    }
}

javafx {
    version = '23' // Use JavaFX 21+ for native arm64 support
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation 'com.google.inject:guice:7.0.0'
    implementation 'org.postgresql:postgresql:42.7.4'
}

application {
    mainClass = 'com.example.Main' // EntryPoint
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/java', 'src/main/resources']
        }
    }
}

run {
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_23)) {
        jvmArgs '--sun-misc-unsafe-memory-access=allow',
        '--add-modules=javafx.controls,javafx.fxml',
        '--enable-native-access=javafx.graphics'
    }
}
