// 
plugins {
    id 'java' // Adds Java support
    id 'application' // Adds Java support and application execution capabilities
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral{
        name = "Maven Central"
    }
}

javafx {
    version = '25' // Use JavaFX 11+, 17+, or 21+ for native arm64 support
    modules = ['javafx.controls', 'javafx.fxml']
    platform = 'mac' // Use 'linux-aarch64' for Linux ARM64 systems
}

dependencies {
    implementation 'com.google.inject:guice:7.0.0'
    implementation 'org.postgresql:postgresql:42.7.4'
    // implementation 'org.apache.commons:commons-lang3:3.12.0' 
}

application {
    mainClass = 'com.example.Main' // Points Gradle to your main method
}

run {
    jvmArgs '--add-modules=javafx.controls,javafx.fxml',
            '--sun-misc-unsafe-memory-access=allow'
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_23)) {
        jvmArgs '--sun-misc-unsafe-memory-access=allow'
    }
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/java', 'src/main/resources']
        }
    }
}
